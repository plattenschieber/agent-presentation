<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="left-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07152f" stop-opacity="0.98"/>
      <stop offset="0.42" stop-color="#07152f" stop-opacity="0.76"/>
      <stop offset="0.72" stop-color="#07152f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07152f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07152f" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#07152f" stop-opacity="0"/>
      <stop offset="1" stop-color="#07152f" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020817" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Composite this transparent overlay over public/round7-evidence-gate-key-art.png. -->
  <rect width="1600" height="900" fill="url(#left-shade)"/>
  <rect width="1600" height="900" fill="url(#edge-shade)"/>

  <g font-family="SF Pro Display, Avenir Next, Helvetica Neue, Arial, sans-serif" filter="url(#soft-shadow)">
    <rect x="88" y="72" width="480" height="54" rx="12" fill="#07152f" fill-opacity="0.74" stroke="#35d7ff" stroke-opacity="0.75" stroke-width="2"/>
    <text x="114" y="108" fill="#d7f7ff" font-size="23" font-weight="650" letter-spacing="2.2">AGENTS ANONYMOUS · COLOGNE</text>

    <g transform="translate(88 154)">
      <rect width="188" height="52" rx="10" fill="#41d98b" fill-opacity="0.14" stroke="#41d98b" stroke-width="2"/>
      <path d="M22 13h20v26H22z M27 18h10v16H27z" fill="none" stroke="#41d98b" stroke-width="2.5"/>
      <text x="58" y="35" fill="#bfffe0" font-size="23" font-weight="760" letter-spacing="1.8">ROUND 7</text>
